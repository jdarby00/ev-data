name: clock
# Fires the day's timed jobs on the minute (board refreshes, the 2:25 pm price request, a close
# snapshot before each tip, free closes before every NBA/NFL/soccer start, and every free dk-odds
# screen and lab run), because GitHub's own cron runs hours late or not at all. See pipeline/clock.py.
# It runs as a chain (--chain): each run hands over to a fresh one before the 6-hour limit, day and
# night, so it no longer needs a cron to start each morning. The crons below only restart a broken
# chain: whichever fires queues behind a running clock and the two never run at once.
on:
  schedule:
    - cron: "5 9 * * *"     # 4:05 am ET (EST): restart before the 5:20 am box scores and the 6:10 am lab
    - cron: "45 10 * * 0,6" # 5:45 am ET Sat/Sun: early soccer kickoffs need the free closes (TEST_PLAN R3)
    - cron: "5 12 * * *"    # 7:05 am ET (EST)
    - cron: "5 15 * * *"    # 10:05 am ET
    - cron: "35 17 * * *"   # 12:35 pm ET
    - cron: "45 18 * * *"   # 1:45 pm ET
    - cron: "40 21 * * *"   # 4:40 pm ET, in case every earlier one was dropped
    - cron: "5 0,2,4 * * *" # 7:05, 9:05, 11:05 pm ET: restart a chain that broke in the evening (closes, late news)
  workflow_dispatch:
    inputs:
      check_token:
        description: "Only test the DK_ODDS_DISPATCH token (no credits)"
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: ${{ inputs.check_token && 'clock-check' || 'clock' }}  # a token check must never replace a waiting clock run
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Tests (offline)
        run: python3 -I tests/test_clock.py
      - name: Run the clock
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DK_ODDS_DISPATCH: ${{ secrets.DK_ODDS_DISPATCH }}
        run: |
          git config user.name "ev-data clock"
          git config user.email "ev-data@users.noreply.github.com"
          if [ "${{ inputs.check_token }}" = "true" ]; then
            python3 -I -u pipeline/clock.py --check-token
          else
            python3 -I -u pipeline/clock.py --chain
          fi
