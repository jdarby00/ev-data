name: gamelogs
# Soccer and NHL player game logs from ESPN (free), for the leg checks. Separate from nba.yml so a slow
# first fill never holds up the NBA board. Daily, plus on demand.
on:
  schedule:
    - cron: "50 10 * * *"   # 5:50 am ET (EST), after the overnight games
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gamelogs
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Tests (offline)
        run: python3 -I tests/test_pipeline.py
      - name: Game logs
        run: python3 -I -u pipeline/espn_gamelogs.py || echo "game logs failed"
      - name: Commit
        run: |
          git config user.name "ev-data bot"
          git config user.email "ev-data@users.noreply.github.com"
          git add data/soccer data/nhl
          git diff --cached --quiet && exit 0
          git commit -q -m "gamelogs: $(TZ=America/New_York date +'%Y-%m-%d %H:%M ET')"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && exit 0; sleep 5; done
          exit 1
